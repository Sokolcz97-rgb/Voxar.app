<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>StudioVoxario Launcher</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: radial-gradient(ellipse at top, #0f172a 0%, #020617 70%);
      color: #e5e7eb;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #06b6d4, #22d3ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 28px; color: #0a0a0f;
      box-shadow: 0 10px 40px -10px rgba(34, 211, 238, 0.6);
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
    .status { color: #94a3b8; font-size: 13px; min-height: 18px; }
    .bar {
      width: 260px; height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden;
    }
    .fill {
      height: 100%; width: 30%;
      background: linear-gradient(90deg, #06b6d4, #22d3ee);
      border-radius: 999px;
      animation: slide 1.4s ease-in-out infinite;
    }
    .version { position: absolute; bottom: 12px; font-size: 11px; color: #475569; }
    @keyframes slide {
      0% { margin-left: -30%; width: 30%; }
      50% { width: 50%; }
      100% { margin-left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">SV</div>
    <h1>StudioVoxario</h1>
    <div class="status" id="status">Spouštění…</div>
    <div class="bar"><div class="fill"></div></div>
  </div>
  <div class="version" id="ver"></div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('launcher:status', (_e, msg) => {
      document.getElementById('status').textContent = msg;
    });
    ipcRenderer.invoke('launcher:version').then(v => {
      document.getElementById('ver').textContent = 'v' + v;
    });
  </script>
</body>
</html>
