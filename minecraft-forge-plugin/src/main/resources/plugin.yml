name: VoxarioForge
version: ${project.version}
main: com.studiovoxario.voxarioforge.VoxarioForge
api-version: "1.21"
folia-supported: true
author: StudioVoxario
description: Vlastni obsah pro Minecraft - Constructs (itemy), Fixtures (nabytek), Sectors (bloky) a Blueprints (.bbmodel) s automatickym resource packem.
commands:
  voxforge:
    description: Sprava VoxarioForge obsahu
    usage: /voxforge gui|give|pack|reload|list|blueprints
    aliases: [vf, forge]
permissions:
  voxarioforge.use:
    default: true
  voxarioforge.admin:
    default: op
