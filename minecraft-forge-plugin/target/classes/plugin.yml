name: VoxarioForge
version: 1.0.0
main: com.studiovoxario.voxarioforge.VoxarioForge
api-version: "1.21"
folia-supported: true
author: StudioVoxario
description: Vlastni obsah pro Minecraft - Constructs (itemy), Fixtures (nabytek), Stations (RPG kovadlina/verpanek), Blueprints (.bbmodel/.iaentitymodel), automaticky resource pack a MySQL sync.
libraries:
  - com.mysql:mysql-connector-j:8.4.0
commands:
  voxforge:
    description: Sprava VoxarioForge obsahu
    usage: /voxforge gui|station|give|pack|sync|reload|list|blueprints|help
    aliases: [vf, forge]
permissions:
  voxarioforge.use:
    default: true
  voxarioforge.admin:
    default: op
