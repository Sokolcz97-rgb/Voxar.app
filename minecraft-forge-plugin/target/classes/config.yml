# VoxarioForge
# Vlastni obsahovy engine (Constructs / Fixtures / Stations / Blueprints)
# Paper / Folia 1.21.11+, Java 21 a vyssi
#
# Struktura slozek (vytvori se sama):
#   plugins/VoxarioForge/sources/voxario|itemsadder|oraxen|nexo/
#       items/ models/ textures/ gui/ source.yml
#   plugins/VoxarioForge/imports/   -> sem hod ZIP, sam se rozbali
#   plugins/VoxarioForge/output/    -> hotovy resource pack

namespace: "voxforge"

content:
  # Automaticky hlidat zmeny v sources/ a imports/ a hned prestavet pack
  auto-build: true
  watch-seconds: 5

pack:
  build-on-start: true
  file-name: "VoxarioForge-Pack.zip"
  description: "StudioVoxario - VoxarioForge content pack"
  # Verejna URL na hostovany ZIP (prazdne = pouzije se vestaveny pack server)
  url: ""
  sha1: ""
  required: false
  auto-resend: true
  http:
    enabled: true
    port: 8123
    # Verejna adresa serveru (IP nebo domena) bez lomitka na konci
    public-host: ""

# Synchronizace obsahu a packu pres MySQL (vice serveru = jeden obsah)
mysql:
  enabled: false
  host: "127.0.0.1"
  port: 3306
  database: "voxarioforge"
  user: "root"
  password: ""
  params: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC"
  # Automaticky stahovat zmeny z DB a prestavovat pack
  auto-sync: true
  interval-seconds: 60
  # Ukladat hotovy ZIP packu i do databaze
  store-pack-blob: true
  publish-pack: true

stations:
  replace-vanilla: true

fixtures:
  enabled: true
  grid-snap: true

gui:
  # Titulek hlavniho RPG menu (vyber pluginu)
  title: "&6&l⚒ &e&lVOXARIO FORGE &6&l⚒"
  rows: 6
