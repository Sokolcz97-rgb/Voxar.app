name: Voxario game build (Ashes of Eryon)

# Fáze 9 převodu (docs/ASHES_OF_ERYON_PORT.md v repozitáři enginu):
#   1. stáhne Voxario Studio z release enginu (Linux tar.gz + Windows portable ZIP),
#   2. složí hru tools/package-game.sh (jako VoxarioEditor --build-game),
#   3. pustí samotest (software Vulkan, virtuální displej) – záběry jako Unity selftest ve dne
#      (--time 13), chyba skriptu nebo chybějící „SELFTEST hotovo“ shodí běh,
#   3b. hotovou hru pro Windows spustí na Windows runneru (Mesa lavapipe) a vyfotí,
#   4. připraví soubory pro testovací kanál launcheru (unity/latest-beta.json),
#   5. na vyžádání je nahraje do bucketu game-updates (jen ruční spuštění s publish_beta),
#   6. prepare_stable: ostrá verze (např. 0.11.0) se nahraje do game-updates/unity/<verze>/ a manifest
#      jen jako unity/latest-candidate.json – ostrý kanál (latest.json) se tím NEPŘEPNE. Přepnutí =
#      zkopírovat latest-candidate.json na latest.json (docs/PRECHOD_NA_VOXARIO.md).
#
# Secrets:
#   VOXARIO_ENGINE_TOKEN     – token se čtením repozitáře Sokolcz97-rgb/Voxario-Studio-Engine (release)
#   SUPABASE_SERVICE_ROLE_KEY – jen pro publish_beta (zápis do bucketu game-updates)

on:
  push:
    paths:
      - 'game/voxario/**'
      - 'game/unity/AshesOfEryon/Assets/Models/**'
      - 'game/unity/AshesOfEryon/Assets/Voxario/Resources/**'
      - 'game/unity/make-manifest.cjs'
      - '.github/workflows/voxario-game.yml'
  workflow_dispatch:
    inputs:
      engine_tag:
        description: 'Tag release enginu (prázdné = nejnovější)'
        required: false
        default: ''
      version:
        description: 'Verze hry (prázdné = 0.11.0-beta.<číslo běhu>)'
        required: false
        default: ''
      publish_beta:
        description: 'Nahrát do testovacího kanálu launcheru (unity/latest-beta.json)'
        type: boolean
        required: false
        default: false
      prepare_stable:
        description: 'Připravit ostrou verzi (soubory + unity/latest-candidate.json, latest.json se NEMĚNÍ)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: voxario-game-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REPO: Sokolcz97-rgb/Voxario-Studio-Engine
  PROJECT: game/voxario/AshesOfEryon

jobs:
  selftest:
    name: Samotest (Linux, software Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verze
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="0.11.0-beta.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Verze hry: $v"

      - name: Stáhnout Voxario Studio (Linux)
        env:
          GH_TOKEN: ${{ secrets.VOXARIO_ENGINE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Chybí secret VOXARIO_ENGINE_TOKEN (čtení release z $ENGINE_REPO)."
            exit 1
          fi
          gh release download ${{ inputs.engine_tag }} --repo "$ENGINE_REPO" --pattern 'voxario-studio-*-linux-x86_64.tar.gz' -D "$RUNNER_TEMP/engine"
          tar -xzf "$RUNNER_TEMP"/engine/*.tar.gz -C "$RUNNER_TEMP/engine"
          find "$RUNNER_TEMP/engine" -name VoxarioPlayer -type f

      - name: Závislosti (Mesa Vulkan, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0

      - name: Složit hru (Linux)
        run: $PROJECT/tools/package-game.sh "$RUNNER_TEMP/engine" "$RUNNER_TEMP/game-linux" "${{ steps.ver.outputs.version }}"

      - name: Samotest
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game-linux/AshesOfEryon -ashes-launcher --time 13 --selftest "$GITHUB_WORKSPACE/selftest" 2>&1 | tee "$GITHUB_WORKSPACE/player.log"
          cd "$GITHUB_WORKSPACE"
          shots=$(ls selftest/*.png | wc -l)
          echo "Záběrů: $shots"
          if grep -E "Script error|disabled after repeated errors" player.log; then
            echo "::error::Chyba skriptu hry (viz player.log)"
            exit 1
          fi
          grep -q "SELFTEST hotovo" player.log || { echo "::error::Samotest nedoběhl"; exit 1; }
          [ "$shots" -ge 25 ] || { echo "::error::Málo záběrů ($shots)"; exit 1; }
          # žádný načtený model nesmí být bez barvy (bílé siluety LOD)
          if grep -a "Model without color" player.log; then
            echo "::error::Model bez textury, barvy materiálu i barev vrcholů (vykreslí se bíle)"
            exit 1
          fi

      - name: Klidný obraz (stojící hráč, dva snímky po sobě)
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 - <<'PY'
          import numpy as np
          from PIL import Image
          a = np.asarray(Image.open("selftest/15a-klid.png").convert("RGB")).astype(np.int16)
          b = np.asarray(Image.open("selftest/15b-klid.png").convert("RGB")).astype(np.int16)
          # tráva, stromy ve větru a zvířata se hýbou (část obrazu), chvění kamery ale změní skoro všechny
          # pixely (posun o 1 px = medián rozdílu >= 1) – proto percentily, ne průměr
          d = np.abs(a - b).max(axis=2)
          p60, p75 = float(np.percentile(d, 60)), float(np.percentile(d, 75))
          print(f"rozdíl snímků: průměr {d.mean():.2f}, 60. percentil {p60:.1f}, 75. percentil {p75:.1f} (z 255)")
          if p60 > 0.5 or p75 > 3:
              raise SystemExit("::error::Obraz stojícího hráče se mezi snímky mění (chvění kamery)")
          PY

      - name: Samotest UI v 2560 × 1440
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          ASHES_SELFTEST_ONLY=ui VOXARIO_NO_AUDIO=1 timeout 600 xvfb-run -a -s "-screen 0 2600x1500x24" ./game-linux/AshesOfEryon -ashes-launcher --time 13 --window 2560x1440 --selftest "$GITHUB_WORKSPACE/selftest-1440p" 2>&1 | tee "$GITHUB_WORKSPACE/player-1440p.log"
          cd "$GITHUB_WORKSPACE"
          grep -q "SELFTEST hotovo" player-1440p.log || { echo "::error::Samotest UI nedoběhl"; exit 1; }
          if grep -E "Script error" player-1440p.log; then echo "::error::Chyba skriptu (1440p)"; exit 1; fi
          python3 -c "from PIL import Image; im = Image.open('selftest-1440p/ui-nastaveni-grafika.png'); print('1440p snímek', im.size); assert im.size == (2560, 1440)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AshesOfEryon-selftest
          path: |
            player.log
            player-1440p.log
            selftest/
            selftest-1440p/
          retention-days: 14

  windows:
    name: Hra pro Windows + soubory pro launcher
    needs: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout Voxario Studio (Windows)
        env:
          GH_TOKEN: ${{ secrets.VOXARIO_ENGINE_TOKEN }}
        run: |
          gh release download ${{ inputs.engine_tag }} --repo "$ENGINE_REPO" --pattern 'VoxarioStudio-*-win64-portable.zip' -D "$RUNNER_TEMP/engine"
          unzip -q "$RUNNER_TEMP"/engine/*.zip -d "$RUNNER_TEMP/engine"
          find "$RUNNER_TEMP/engine" -name VoxarioPlayer.exe -type f

      - name: Složit hru (Windows)
        run: $PROJECT/tools/package-game.sh "$RUNNER_TEMP/engine" "$RUNNER_TEMP/AshesOfEryon" "${{ needs.selftest.outputs.version }}"

      - name: Manifest testovacího kanálu
        run: |
          node game/unity/make-manifest.cjs "$RUNNER_TEMP/AshesOfEryon" "$RUNNER_TEMP/updates" "${{ needs.selftest.outputs.version }}" latest-beta.json
          head -c 400 "$RUNNER_TEMP/updates/latest-beta.json"

      - name: Manifest ostré verze (kandidát – latest.json se nemění)
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_stable
        run: |
          v="${{ needs.selftest.outputs.version }}"
          if [[ "$v" == *-* ]]; then echo "::error::Ostrá verze nesmí mít příponu (je $v)"; exit 1; fi
          node game/unity/make-manifest.cjs "$RUNNER_TEMP/AshesOfEryon" "$RUNNER_TEMP/stable" "$v" latest-candidate.json
          head -c 400 "$RUNNER_TEMP/stable/latest-candidate.json"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_stable
        with:
          name: AshesOfEryon-stable-candidate
          path: ${{ runner.temp }}/stable
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AshesOfEryon-Windows
          path: ${{ runner.temp }}/AshesOfEryon
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: AshesOfEryon-beta-upload
          path: ${{ runner.temp }}/updates
          if-no-files-found: error
          retention-days: 14

  windows-test:
    name: Test exportu pro Windows (spuštění hry, software Vulkan)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AshesOfEryon-Windows
          path: game

      - name: Kontrola balíčku
        shell: pwsh
        run: |
          foreach ($f in "game\AshesOfEryon.exe", "game\game.vgame", "game\GameData\Scenes\Main.vscene", "game\GameData\Scripts\main.lua", "game\GameData\Data\content.json") {
            if (-not (Test-Path $f)) { throw "Chybí $f" }
          }
          $vgame = Get-Content game\game.vgame | ConvertFrom-Json
          if ($vgame.StartupScene -ne "Scenes/Main.vscene") { throw "Špatná startovní scéna" }
          Write-Host "Balíček OK ($((Get-ChildItem game -Recurse | Measure-Object -Sum Length).Sum / 1MB) MB)"

      - name: Mesa lavapipe (Vulkan bez GPU)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa\*.7z).FullName -omesa -y | Out-Null
          $icd = Get-ChildItem mesa -Recurse -Filter lvp_icd.x86_64.json | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $icd) { throw "lvp_icd.x86_64.json nenalezen" }
          "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ICD: $($icd.FullName)"
          # runner běží jako admin – loader pak VK_ICD_FILENAMES ignoruje, ovladač musí být v registru
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          # runner nemá Vulkan loader (u hráčů ho instaluje ovladač grafiky) – vulkan-1.dll od LunarG vedle hry
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip" -OutFile vkrt.zip
          Expand-Archive vkrt.zip -DestinationPath vkrt -Force
          $loader = Get-ChildItem vkrt -Recurse -Filter vulkan-1.dll | Where-Object { $_.Directory.Name -eq "x64" } | Select-Object -First 1
          if (-not $loader) { throw "vulkan-1.dll nenalezen" }
          Copy-Item $loader.FullName game\vulkan-1.dll
          Write-Host "Vulkan loader: $($loader.FullName)"

      - name: Spustit hru (přihlašovací obrazovka, denní svět)
        shell: pwsh
        run: |
          $env:VOXARIO_NO_AUDIO = "1"
          $p = Start-Process -FilePath "game\AshesOfEryon.exe" -ArgumentList "-ashes-launcher", "--time", "13", "--frames", "400", "--screenshot", "$pwd\windows-login.png" -PassThru -RedirectStandardOutput windows.log -RedirectStandardError windows-err.log
          $finished = $p.WaitForExit(360000)
          # log hry (Windows aplikace nepíše na standardní výstup)
          $log = Join-Path $env:APPDATA "Voxario Studio\Logs\VoxarioPlayer.log"
          if (Test-Path $log) { Copy-Item $log voxario-player.log; Get-Content $log -Tail 80 } else { Write-Host "Log hry nenalezen: $log" }
          if (-not $finished) { Stop-Process -Id $p.Id -Force; throw "Hra neskončila včas (viz log výše)" }
          Get-Content windows.log -Tail 40
          if ($p.ExitCode -ne 0) { throw "Hra skončila s kódem $($p.ExitCode)" }
          if (-not (Test-Path windows-login.png)) { throw "Chybí snímek" }
          if (Select-String -Path voxario-player.log -Pattern "Script error" -ErrorAction SilentlyContinue) { throw "Chyba skriptu" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AshesOfEryon-windows-test
          path: |
            windows-login.png
            windows.log
            windows-err.log
            voxario-player.log
          retention-days: 14

  publish-beta:
    name: Nahrát do testovacího kanálu launcheru
    needs: [selftest, windows, windows-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AshesOfEryon-beta-upload
          path: updates

      - name: Nahrát do game-updates/unity/
        env:
          SUPABASE_URL: https://rioexuvgvmdwvidfakxy.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Chybí secret SUPABASE_SERVICE_ROLE_KEY – soubory jsou v artefaktu AshesOfEryon-beta-upload, nahraj je ručně."
            exit 1
          fi
          cd updates
          # nové klíče sb_secret_… patří jen do hlavičky apikey; Authorization: Bearer jen pro starý JWT klíč
          AUTH=()
          if [[ "$KEY" == *.*.* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          upload() {
            local file="$1" type="${2:-application/octet-stream}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/game-updates/unity/$file" \
                -H "apikey: $KEY" "${AUTH[@]}" -H "x-upsert: true" -H "Content-Type: $type" -H "Cache-Control: max-age=60" \
                --data-binary "@$file")
              [ "$code" = "200" ] && return 0
              echo "HTTP $code pro $file (pokus $attempt): $(head -c 200 /tmp/resp)"
              sleep $((attempt * 4))
            done
            return 1
          }
          # nejdřív soubory verze, manifest až nakonec (launcher nesmí vidět neúplnou verzi)
          find . -type f ! -name latest-beta.json | sed 's|^\./||' | while read -r f; do upload "$f" || exit 1; done
          upload latest-beta.json application/json
          echo "Testovací kanál: verze ${{ needs.selftest.outputs.version }}"

  publish-stable-candidate:
    name: Nahrát kandidáta ostré verze (bez přepnutí latest.json)
    needs: [selftest, windows, windows-test]
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AshesOfEryon-stable-candidate
          path: updates

      - name: Nahrát do game-updates/unity/
        env:
          SUPABASE_URL: https://rioexuvgvmdwvidfakxy.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Chybí secret SUPABASE_SERVICE_ROLE_KEY – soubory jsou v artefaktu AshesOfEryon-stable-candidate, nahraj je ručně."
            exit 1
          fi
          cd updates
          # nové klíče sb_secret_… patří jen do hlavičky apikey; Authorization: Bearer jen pro starý JWT klíč
          AUTH=()
          if [[ "$KEY" == *.*.* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          upload() {
            local file="$1" type="${2:-application/octet-stream}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/game-updates/unity/$file" \
                -H "apikey: $KEY" "${AUTH[@]}" -H "x-upsert: true" -H "Content-Type: $type" -H "Cache-Control: max-age=60" \
                --data-binary "@$file")
              [ "$code" = "200" ] && return 0
              echo "HTTP $code pro $file (pokus $attempt): $(head -c 200 /tmp/resp)"
              sleep $((attempt * 4))
            done
            return 1
          }
          # nejdřív soubory verze, manifest až nakonec (launcher nesmí vidět neúplnou verzi)
          find . -type f ! -name latest-candidate.json | sed 's|^\./||' | while read -r f; do upload "$f" || exit 1; done
          upload latest-candidate.json application/json
          echo "Kandidát ostré verze (latest.json beze změny): verze ${{ needs.selftest.outputs.version }}"
