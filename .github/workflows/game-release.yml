name: Game prerelease

on:
  push:
    tags:
      - 'game-v*'

permissions:
  contents: write

concurrency:
  group: game-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate game foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f game/README.md
          test -f game/world/Core.realm
          test -f game/release/game-manifest.example.json
          test -f docs/GAME_FOUNDATION.md

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^game-v ]]; then
            echo "Unexpected game tag: $TAG"
            exit 1
          fi

          echo "Game source validated for $TAG"
          echo "Foundation release intentionally contains no GameSetup.exe."

      - name: Create separate game prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG"             --title "Game ${TAG#game-v}"             --prerelease             --generate-notes

          echo "Created separate game prerelease $TAG with no installer assets."
