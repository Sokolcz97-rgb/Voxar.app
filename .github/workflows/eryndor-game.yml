name: Eryndor (kanál Fantasy)

# Testovací fantasy hra Eryndor (game/voxario/Eryndor) na Voxario Studio Engine:
#   * samotest na Linuxu (software Vulkan): výběr povolání, boj, rozhovor s Lyrise
#   * sestavení pro Windows a nahrání do bucketu game-updates/unity/fantasy/<verze>/ + unity/latest-fantasy.json
#     (launcher od 0.7.0: Nastavení → Kanál hry → Fantasy)
#   * volitelně vydání launcheru (game-updates/launcher/, stable.json jako poslední)
# Secrets: VOXARIO_ENGINE_TOKEN (čtení release enginu), SUPABASE_SERVICE_ROLE_KEY (zápis do bucketu)

on:
  push:
    paths:
      - 'game/voxario/Eryndor/**'
      - '.github/workflows/eryndor-game.yml'
  workflow_dispatch:
    inputs:
      engine_tag:
        description: 'Tag release enginu'
        required: false
        default: 'v1.18.1'
      version:
        description: 'Verze hry (prázdné = 0.1.0-dev.<číslo běhu>)'
        required: false
        default: ''
      publish:
        description: 'Nahrát do kanálu Fantasy (unity/latest-fantasy.json)'
        type: boolean
        required: false
        default: false
      publish_launcher:
        description: 'Vydat launcher (verze z game/launcher/app/package.json) s kanálem Fantasy'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: eryndor-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REPO: Sokolcz97-rgb/Voxario-Studio-Engine
  PROJECT: game/voxario/Eryndor
  ENGINE_TAG: ${{ inputs.engine_tag || 'v1.18.1' }}

jobs:
  selftest:
    name: Samotest (Linux, software Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verze
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="0.1.0-dev.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Stáhnout Voxario Studio (Linux)
        env:
          GH_TOKEN: ${{ secrets.VOXARIO_ENGINE_TOKEN }}
        run: |
          downloaded=0
          for attempt in $(seq 1 30); do
            if output=$(gh release download "$ENGINE_TAG" --repo "$ENGINE_REPO" --pattern 'voxario-studio-*-linux-x86_64.tar.gz' -D "$RUNNER_TEMP/engine" 2>&1); then
              [ -z "$output" ] || printf '%s\n' "$output"
              downloaded=1
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              printf '%s\n' "$output"
              echo "::error::Engine $ENGINE_TAG nemá Linux release asset ani po 15 minutách"
              exit 1
            fi
            echo "Engine $ENGINE_TAG ještě není připraven; další pokus za 30 s ($attempt/30)"
            sleep 30
          done
          [ "$downloaded" -eq 1 ]
          tar -xzf "$RUNNER_TEMP"/engine/*.tar.gz -C "$RUNNER_TEMP/engine"
      - name: Závislosti
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0
      - name: Složit hru (Linux)
        run: $PROJECT/tools/package-game.sh "$RUNNER_TEMP/engine" "$RUNNER_TEMP/game" "${{ steps.ver.outputs.version }}"
      - name: Ověřit modely ras a výbavy
        run: python3 "$PROJECT/tools/eryndor_model_check.py"
      - name: Samotest (hra)
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=game VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest" 2>&1 | tee "$GITHUB_WORKSPACE/player.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player.log; then echo "::error::Chyba skriptu"; exit 1; fi
          grep -q "SELFTEST hotovo" player.log || { echo "::error::Samotest nedoběhl"; exit 1; }
          echo "Záběrů: $(ls selftest/*.png | wc -l)"

      - name: Samotest kouře a částic
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-particles"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=kouzla VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-particles" 2>&1 | tee "$GITHUB_WORKSPACE/player-particles.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-particles.log; then echo "::error::Chyba skriptu částic"; exit 1; fi
          grep -q "SELFTEST hotovo" player-particles.log || { echo "::error::Samotest částic nedoběhl"; exit 1; }
          for shot in k8-koure k9-taborak k10-sopka; do
            test -s "selftest-particles/$shot.png" || { echo "::error::Chybí snímek $shot"; exit 1; }
          done

      - name: Samotest postav zblízka
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-characters"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=oblicej VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-characters" 2>&1 | tee "$GITHUB_WORKSPACE/player-characters.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-characters.log; then echo "::error::Chyba samotestu postav"; exit 1; fi
          grep -q "SELFTEST hotovo" player-characters.log || { echo "::error::Samotest postav nedoběhl"; exit 1; }
          test -s selftest-characters/f01.png || { echo "::error::Chybí referenční detail postavy"; exit 1; }

      - name: Samotest vody
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-water"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=voda VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-water" 2>&1 | tee "$GITHUB_WORKSPACE/player-water.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-water.log; then echo "::error::Chyba samotestu vody"; exit 1; fi
          grep -q "SELFTEST hotovo" player-water.log || { echo "::error::Samotest vody nedoběhl"; exit 1; }
          for shot in w1-plaz-jako-reference w3-otevrene-more w7-reka; do
            test -s "selftest-water/$shot.png" || { echo "::error::Chybí snímek $shot"; exit 1; }
          done

      - name: Samotest všech ras a výbavy
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-races"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=creator VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-races" 2>&1 | tee "$GITHUB_WORKSPACE/player-races.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-races.log; then echo "::error::Chyba samotestu ras a výbavy"; exit 1; fi
          grep -q "SELFTEST hotovo" player-races.log || { echo "::error::Samotest ras nedoběhl"; exit 1; }
          for shot in c01-clovek c03-trpaslik c05-elf c07-vila c09-obr c11-kocka c13-kocka-zrzava; do
            test -s "selftest-races/$shot.png" || { echo "::error::Chybí snímek $shot"; exit 1; }
          done

      - name: Samotest výběru a správy postav
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-creator-ui"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=creator_ui VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-creator-ui" 2>&1 | tee "$GITHUB_WORKSPACE/player-creator-ui.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-creator-ui.log; then echo "::error::Chyba správy postav"; exit 1; fi
          grep -q "SELFTEST hotovo" player-creator-ui.log || { echo "::error::Samotest správy postav nedoběhl"; exit 1; }
          for shot in cu1-vyber-postav cu2-potvrzeni-smazani cu3-postava-smazana cu4-tvorba-postavy; do
            test -s "selftest-creator-ui/$shot.png" || { echo "::error::Chybí snímek $shot"; exit 1; }
          done

      - name: Samotest tekoucí lávy
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/selftest-lava"
          cd "$RUNNER_TEMP"
          VOXARIO_SELFTEST_ONLY=lava VOXARIO_NO_AUDIO=1 timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./game/Eryndor --selftest "$GITHUB_WORKSPACE/selftest-lava" 2>&1 | tee "$GITHUB_WORKSPACE/player-lava.log"
          cd "$GITHUB_WORKSPACE"
          if grep -E "Script error|disabled after repeated errors" player-lava.log; then echo "::error::Chyba samotestu lávy"; exit 1; fi
          grep -q "SELFTEST hotovo" player-lava.log || { echo "::error::Samotest lávy nedoběhl"; exit 1; }
          for shot in l1-lava-flow l2-lavova-reka; do
            test -s "selftest-lava/$shot.png" || { echo "::error::Chybí snímek $shot"; exit 1; }
          done

      - name: Nahrát snímky samotestů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eryndor-selftest-screenshots
          path: |
            selftest/*.png
            selftest-particles/*.png
            selftest-characters/*.png
            selftest-water/*.png
            selftest-races/*.png
            selftest-creator-ui/*.png
            selftest-lava/*.png
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Hra pro Windows + kanál Fantasy
    needs: selftest
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout Voxario Studio (Windows)
        env:
          GH_TOKEN: ${{ secrets.VOXARIO_ENGINE_TOKEN }}
        run: |
          downloaded=0
          for attempt in $(seq 1 30); do
            if output=$(gh release download "$ENGINE_TAG" --repo "$ENGINE_REPO" --pattern 'VoxarioStudio-*-win64-portable.zip' -D "$RUNNER_TEMP/engine" 2>&1); then
              [ -z "$output" ] || printf '%s\n' "$output"
              downloaded=1
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              printf '%s\n' "$output"
              echo "::error::Engine $ENGINE_TAG nemá Windows release asset ani po 15 minutách"
              exit 1
            fi
            echo "Engine $ENGINE_TAG ještě není připraven; další pokus za 30 s ($attempt/30)"
            sleep 30
          done
          [ "$downloaded" -eq 1 ]
          unzip -q "$RUNNER_TEMP"/engine/*.zip -d "$RUNNER_TEMP/engine"
      - name: Složit hru (Windows) a manifest
        run: |
          v="${{ needs.selftest.outputs.version }}"
          $PROJECT/tools/package-game.sh "$RUNNER_TEMP/engine" "$RUNNER_TEMP/Eryndor" "$v"
          test -f "$RUNNER_TEMP/Eryndor/Eryndor.exe"
          node game/unity/make-manifest.cjs "$RUNNER_TEMP/Eryndor" "$RUNNER_TEMP/updates" "$v" latest-fantasy.json fantasy/
      - name: Nahrát do game-updates/unity/fantasy/
        env:
          SUPABASE_URL: https://rioexuvgvmdwvidfakxy.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Chybí secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          AUTH=()
          if [[ "$KEY" == *.*.* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          upload() {
            local file="$1" type="${2:-application/octet-stream}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/game-updates/unity/$file" \
                -H "apikey: $KEY" "${AUTH[@]}" -H "x-upsert: true" -H "Content-Type: $type" -H "Cache-Control: max-age=60" \
                --data-binary "@$file")
              [ "$code" = "200" ] && return 0
              echo "HTTP $code pro $file (pokus $attempt): $(head -c 200 /tmp/resp)"
              sleep $((attempt * 4))
            done
            return 1
          }
          cd "$RUNNER_TEMP/updates"
          find . -type f ! -name latest-fantasy.json | sed 's|^\./||' | while read -r f; do upload "$f" || exit 1; done
          upload latest-fantasy.json application/json
          echo "Kanál Fantasy: Eryndor ${{ needs.selftest.outputs.version }}"

  launcher:
    name: Launcher s kanálem Fantasy
    if: github.event_name == 'workflow_dispatch' && inputs.publish_launcher
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Sestavit launcher
        working-directory: game/launcher/app
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run pack:win
      - name: Připravit a nahrát aktualizaci launcheru
        shell: bash
        env:
          SUPABASE_URL: https://rioexuvgvmdwvidfakxy.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Chybí secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          cd game/launcher/app
          node make-update.cjs dist/win-unpacked/resources "$RUNNER_TEMP/launcher-update"
          AUTH=()
          if [[ "$KEY" == *.*.* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          upload() {
            local file="$1" type="${2:-application/octet-stream}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/game-updates/launcher/$file" \
                -H "apikey: $KEY" "${AUTH[@]}" -H "x-upsert: true" -H "Content-Type: $type" -H "Cache-Control: max-age=60" \
                --data-binary "@$file")
              [ "$code" = "200" ] && return 0
              echo "HTTP $code pro $file (pokus $attempt): $(head -c 200 /tmp/resp)"
              sleep $((attempt * 4))
            done
            return 1
          }
          cd "$RUNNER_TEMP/launcher-update"
          find . -type f ! -name stable.json | sed 's|^\./||' | while read -r f; do upload "$f" || exit 1; done
          upload stable.json application/json
          echo "Launcher vydán: $(node -p "require('$GITHUB_WORKSPACE/game/launcher/app/package.json').version")"
