name: Launcher update diagnostics

on:
  push:
    branches: ['launcher/update-crash']

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build launcher (installed version)
        working-directory: game/launcher/app
        run: |
          npm install --no-audit --no-fund
          npm run pack:win
      - name: Install like GameSetup
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA "StudioVoxario\Ashes of Eryon\Launcher"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force "game/launcher/app/dist/win-unpacked/*" $root
          Get-ChildItem $root | Select-Object Name
      - name: Build update 0.4.9
        working-directory: game/launcher/app
        shell: pwsh
        run: |
          (Get-Content package.json -Raw) -replace '"version": "[0-9.]+"', '"version": "0.4.9"' | Set-Content package.json -NoNewline
          Remove-Item -Recurse -Force dist
          npm run pack:win
          node make-update.cjs dist/win-unpacked/resources "$env:RUNNER_TEMP/upd"
          Get-Content "$env:RUNNER_TEMP/upd/latest.json" -TotalCount 5
      - name: Self-update end to end
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","$env:RUNNER_TEMP/upd" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:ASHES_UPDATE_BASE = "http://127.0.0.1:8765/"
          $exe = Join-Path $env:LOCALAPPDATA "StudioVoxario\Ashes of Eryon\Launcher\Ashes of Eryon Launcher.exe"
          function Show($label) {
            Write-Host "---- $label"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -like '*Ashes*' -or ($_.Name -like 'powershell*' -and "$($_.CommandLine)" -like '*ashes-launcher-update*') } | ForEach-Object { Write-Host "PROC pid=$($_.ProcessId) parent=$($_.ParentProcessId) name=$($_.Name) cmd=$("$($_.CommandLine)".Substring(0, [Math]::Min(200, "$($_.CommandLine)".Length)))" }
            Get-Process | Where-Object { $_.ProcessName -like '*Ashes*' -and $_.MainWindowHandle -ne 0 } | ForEach-Object { Write-Host "WINDOW pid=$($_.Id) title=$($_.MainWindowTitle)" }
            $asar = Join-Path (Split-Path $exe) "resources\app.asar"
            $t = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($asar))
            Write-Host ("installed asar version: " + ([regex]::Match($t, '"version":\s*"([0-9.]+)"').Groups[1].Value))
            Get-ChildItem $env:APPDATA -Recurse -Filter launcher.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 15 }
            Get-ChildItem $env:TEMP -Filter "ashes-launcher-update-*.ps1" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "script $($_.Name) $($_.Length) B" }
          }
          Start-Process -FilePath $exe
          for ($i = 0; $i -lt 3; $i++) { Start-Sleep 15; Show "after $((($i+1)*15)) s" }
          Get-ChildItem $env:APPDATA -Recurse -Filter launcher-update.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== TRANSCRIPT $($_.FullName)"; Get-Content $_.FullName | Select-Object -Last 40 }
          Write-Host "==== run update script by hand"
          Get-ChildItem $env:TEMP -Filter "ashes-launcher-update-*.ps1" | Select-Object -First 1 | ForEach-Object {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $_.FullName 2>&1 | Select-Object -First 20
            Write-Host "script exit: $LASTEXITCODE"
          }
          Start-Sleep 10
          Show "after script by hand"
          Write-Host "==== second manual start"
          Get-Process | Where-Object { $_.ProcessName -like '*Ashes*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $p = Start-Process -FilePath $exe -ArgumentList "--enable-logging" -PassThru -RedirectStandardError "$env:RUNNER_TEMP\manual.err" -RedirectStandardOutput "$env:RUNNER_TEMP\manual.out"
          Start-Sleep 15
          Write-Host "manual alive: $(-not $p.HasExited) exit=$($p.ExitCode)"
          Get-Content "$env:RUNNER_TEMP\manual.err","$env:RUNNER_TEMP\manual.out" -ErrorAction SilentlyContinue | Select-Object -Last 30
          Show "after manual start"
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
