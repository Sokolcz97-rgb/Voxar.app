name: Unity probe

on:
  push:
    branches:
      - 'unity/prototype'
    paths:
      - '.github/workflows/unity-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Inspect Unity 6000.0.85f1 image
        run: |
          IMG=unityci/editor:ubuntu-6000.0.85f1-windows-mono-3
          docker pull -q $IMG
          docker run --rm $IMG bash -lc '
            E=/opt/unity/Editor
            echo "== templates"; ls $E/Data/Resources/PackageManager/ProjectTemplates/ 2>/dev/null
            for t in $E/Data/Resources/PackageManager/ProjectTemplates/*hdrp*.tgz $E/Data/Resources/PackageManager/ProjectTemplates/*high*.tgz; do
              [ -f "$t" ] || continue; echo "== $t"; mkdir -p /tmp/t && tar -xzf "$t" -C /tmp/t && find /tmp/t -name manifest.json -exec cat {} \; ; rm -rf /tmp/t
            done
            echo "== builtin SRP packages"; ls $E/Data/Resources/PackageManager/BuiltInPackages 2>/dev/null | grep -i -E "render|nvidia|gltf|shadergraph|core" 
            echo "== editor manifest"; cat $E/Data/Resources/PackageManager/Editor/manifest.json 2>/dev/null | head -80
            echo "== nvidia files"; find $E/Data -iname "*nvngx*" -o -iname "*dlss*" 2>/dev/null | head -20
            echo "== windows player"; ls $E/Data/PlaybackEngines/ 2>/dev/null
            for p in com.unity.render-pipelines.high-definition com.unity.render-pipelines.core com.unity.shadergraph com.unity.modules.nvidia com.unity.render-pipelines.high-definition-config; do
              echo "== $p: $(grep -m1 "\"version\"" $E/Data/Resources/PackageManager/BuiltInPackages/$p/package.json)"
            done
          '
      - name: Registry versions
        run: |
          curl -s https://packages.unity.com/com.unity.cloud.gltfast | jq -r '.versions | keys[]' | sort -V | tail -6
          curl -s https://packages.unity.com/com.unity.ugui | jq -r '.versions | keys[]' | sort -V | tail -3
