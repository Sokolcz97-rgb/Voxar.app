name: Build StudioVoxario

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm install

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Package Electron app (win32-x64)
        run: npx --yes @electron/packager electron StudioVoxario --platform=win32 --arch=x64 --out=electron-release --overwrite --icon=electron/assets/icon.ico

      - name: Prepare installer icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/assets | Out-Null
          Copy-Item electron/assets/icon.ico installer/assets/icon.ico -Force

      - name: Install installer deps
        working-directory: installer
        run: npm install

      - name: Build HUD installer .exe
        working-directory: installer
        run: node build.cjs

      - name: Build self-extracting installer (.exe)
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payloadDir = "installer/dist/StudioVoxarioInstaller-win32-x64"
          $exe = Join-Path $payloadDir "StudioVoxarioInstaller.exe"
          if (!(Test-Path $exe)) { throw "Installer payload not found at $exe" }

          # 1) Stáhni 7-Zip Extra (obsahuje SFX moduly 7zSD.sfx / 7zS.sfx)
          $extraZip = "$env:RUNNER_TEMP\7zextra.7z"
          $extraDir = "$env:RUNNER_TEMP\7zextra"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.7-zip.org/a/7z2301-extra.7z" -OutFile $extraZip
          New-Item -ItemType Directory -Force -Path $extraDir | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $extraZip "-o$extraDir" -y | Out-Null
          $sfx = Join-Path $extraDir "7zSD.sfx"
          if (!(Test-Path $sfx)) { throw "7zSD.sfx not found after extract" }

          # 2) Zabal CELOU složku instalátoru (ffmpeg.dll, *.pak, locales, resources...) do 7z
          $archive = "$env:RUNNER_TEMP\payload.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $payloadDir
          & 'C:\Program Files\7-Zip\7z.exe' a -t7z -mx=9 -ms=on $archive "*" | Out-Null
          Pop-Location

          # 3) SFX config — po rozbalení spustí HUD instalátor
          $cfg = "$env:RUNNER_TEMP\config.txt"
@"
;!@Install@!UTF-8!
Title="StudioVoxario"
BeginPrompt="Instalovat StudioVoxario?"
RunProgram="StudioVoxarioInstaller.exe"
GUIMode="2"
;!@InstallEnd@!
"@ | Set-Content -Path $cfg -Encoding UTF8

          # 4) Spoj SFX + config + payload → jeden .exe
          $outDir = "installer/dist/final"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $renamed = Join-Path $outDir "StudioVoxarioSetup-0.0.9-alpha.exe"
          cmd /c "copy /b `"$sfx`" + `"$cfg`" + `"$archive`" `"$renamed`"" | Out-Null
          if (!(Test-Path $renamed)) { throw "SFX build failed" }

          $size = (Get-Item $renamed).Length
          $hash = (Get-FileHash $renamed -Algorithm SHA256).Hash.ToLower()
          Write-Host "SFX installer size: $size bytes, sha256: $hash"
          echo "path=$renamed" >> $env:GITHUB_OUTPUT
          echo "size=$size" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "filename=StudioVoxarioSetup-0.0.9-alpha.exe" >> $env:GITHUB_OUTPUT

      - name: Create / update GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: StudioVoxario Desktop (latest)
          body: |
            Automatický build z commitu ${{ github.sha }}.
            Verze: 0.0.9-alpha
          files: ${{ steps.locate.outputs.path }}
          prerelease: true
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write installer pointer JSON
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets/downloads | Out-Null
          $url = "https://github.com/${{ github.repository }}/releases/download/desktop-latest/${{ steps.locate.outputs.filename }}"
          $obj = [ordered]@{
            version           = 1
            url               = $url
            original_filename = "${{ steps.locate.outputs.filename }}"
            size              = [int64]"${{ steps.locate.outputs.size }}"
            sha256            = "${{ steps.locate.outputs.sha256 }}"
            content_type      = "application/x-msdownload"
            source            = "github-release"
            tag               = "desktop-latest"
            commit            = "${{ github.sha }}"
            updated_at        = (Get-Date).ToUniversalTime().ToString("o")
          }
          $json = $obj | ConvertTo-Json -Depth 5
          Set-Content -Path src/assets/downloads/windows-installer.asset.json -Value $json -Encoding UTF8
          Get-Content src/assets/downloads/windows-installer.asset.json

      - name: Commit updated pointer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/downloads/windows-installer.asset.json
          if git diff --cached --quiet; then
            echo "No pointer changes to commit."
          else
            git commit -m "ci: update Windows installer pointer [skip ci]"
            git push
          fi
