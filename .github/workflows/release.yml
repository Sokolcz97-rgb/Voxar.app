name: Build StudioVoxario

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve app version
        id: appver
        shell: pwsh
        run: |
          $v = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if (!$v) { throw "Version missing in electron/package.json" }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z\.-]+)?$') { throw "Version '$v' is not valid semver (x.y.z)" }
          Write-Host "App version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append


      - name: Install root deps
        run: npm install

      - name: Build frontend (Vite)
        run: npm run desktop:prepare

      - name: Verify packaged renderer
        shell: pwsh
        run: |
          if (!(Test-Path "electron/dist/index.html")) { throw "Missing electron/dist/index.html" }
          if (!(Test-Path "electron/dist/assets")) { throw "Missing electron/dist/assets" }

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Package Electron app (win32-x64)
        run: npx --yes @electron/packager electron Voxar.app --platform=win32 --arch=x64 --out=electron-release --overwrite --icon=electron/assets/icon.ico

      - name: Prepare installer icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/assets | Out-Null
          Copy-Item electron/assets/icon.ico installer/assets/icon.ico -Force

      - name: Install installer deps
        working-directory: installer
        run: npm install

      - name: Build HUD installer .exe (Voxar.app + VoxarioBrowser modul)
        working-directory: installer
        run: node build.cjs


      - name: Build self-extracting installers (.exe)
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.appver.outputs.version }}"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip not installed at $sevenZip" }

          Write-Host "== Download LZMA SDK (SFX modules) =="
          $extraArchive = Join-Path $env:RUNNER_TEMP "lzma-sdk.7z"
          $extraDir     = Join-Path $env:RUNNER_TEMP "lzma-sdk"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.7-zip.org/a/lzma2602.7z" -OutFile $extraArchive
          if (Test-Path $extraDir) { Remove-Item -Recurse -Force $extraDir }
          New-Item -ItemType Directory -Force -Path $extraDir | Out-Null
          & $sevenZip x $extraArchive "-o$extraDir" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed with code $LASTEXITCODE" }
          $sfx = (Get-ChildItem -Recurse $extraDir -Filter "7zSD.sfx" -File | Select-Object -First 1)
          if ($null -eq $sfx) { throw "7zSD.sfx not found after extracting LZMA SDK" }
          $sfx = $sfx.FullName

          $outDir = "installer/dist/final"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $targets = @(
            [ordered]@{ key = "app"; payload = "installer/dist/StudioVoxarioInstaller-win32-x64"; exe = "StudioVoxarioInstaller.exe"; title = "StudioVoxario"; out = "StudioVoxarioSetup-$version.exe" }
          )


          $paths = @()
          foreach ($t in $targets) {
            Write-Host ("== Building SFX for {0} ==" -f $t.key)
            $payloadDir = Resolve-Path $t.payload
            $exe = Join-Path $payloadDir $t.exe
            if (!(Test-Path $exe)) { throw "Installer payload not found at $exe" }

            $archive = Join-Path $env:RUNNER_TEMP ("payload-" + $t.key + ".7z")
            if (Test-Path $archive) { Remove-Item $archive -Force }
            Push-Location $payloadDir
            try {
              & $sevenZip a -t7z -mx=5 -ms=on -r $archive ".\*"
              if ($LASTEXITCODE -ne 0) { throw "7z pack failed with code $LASTEXITCODE" }
            } finally { Pop-Location }

            $cfg = Join-Path $env:RUNNER_TEMP ("config-" + $t.key + ".txt")
            $configLines = @(
              ';!@Install@!UTF-8!',
              ('Title="{0}"' -f $t.title),
              ('RunProgram="{0}"' -f $t.exe),
              'GUIMode="2"',
              ';!@InstallEnd@!'
            )
            $utf8Bom = New-Object System.Text.UTF8Encoding($true)
            [System.IO.File]::WriteAllText($cfg, ($configLines -join "`r`n") + "`r`n", $utf8Bom)

            $renamed = Join-Path $outDir $t.out
            if (Test-Path $renamed) { Remove-Item $renamed -Force }
            $out = [System.IO.File]::Open($renamed, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            try {
              foreach ($part in @($sfx, $cfg, $archive)) {
                $inStream = [System.IO.File]::OpenRead($part)
                try { $inStream.CopyTo($out) } finally { $inStream.Dispose() }
              }
            } finally { $out.Dispose() }
            if (!(Test-Path $renamed)) { throw "SFX build failed — output missing for $($t.key)" }

            $size = (Get-Item $renamed).Length
            $hash = (Get-FileHash $renamed -Algorithm SHA256).Hash.ToLower()
            Write-Host ("== DONE == {0} ({1:N1} MB) sha256={2}" -f $renamed, ($size / 1MB), $hash)
            $paths += $renamed

            "$($t.key)_path=$renamed"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "$($t.key)_size=$size"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "$($t.key)_sha256=$hash"      | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "$($t.key)_filename=$($t.out)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          Write-Host ("== Built installers ==`n" + ($paths -join "`n"))


      - name: Create / update GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: StudioVoxario Desktop (latest)
          body: |
            Automatický build z commitu ${{ github.sha }}.
            Verze: ${{ steps.appver.outputs.version }}

            - `StudioVoxarioSetup-${{ steps.appver.outputs.version }}.exe` — jeden instalátor: Voxar.app + modul VoxarioBrowser (volitelně)
          files: |
            installer/dist/final/StudioVoxarioSetup-${{ steps.appver.outputs.version }}.exe
          prerelease: true
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write installer pointer JSON
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets/downloads | Out-Null
          $base = "https://github.com/${{ github.repository }}/releases/download/desktop-latest"
          $url  = "$base/${{ steps.locate.outputs.app_filename }}"

          $obj = [ordered]@{
            version           = 1
            url               = $url
            original_filename = "${{ steps.locate.outputs.app_filename }}"
            size              = [int64]"${{ steps.locate.outputs.app_size }}"
            sha256            = "${{ steps.locate.outputs.app_sha256 }}"
            content_type      = "application/x-msdownload"
            source            = "github-release"
            tag               = "desktop-latest"
            commit            = "${{ github.sha }}"
            updated_at        = (Get-Date).ToUniversalTime().ToString("o")
          }
          Set-Content -Path src/assets/downloads/windows-installer.asset.json -Value ($obj | ConvertTo-Json -Depth 5) -Encoding UTF8

          New-Item -ItemType Directory -Force -Path public | Out-Null
          $manifest = [ordered]@{
            version    = "${{ steps.appver.outputs.version }}"
            notes      = "Automaticky vydaná verze ${{ steps.appver.outputs.version }}."
            url        = $url
            sha256     = "${{ steps.locate.outputs.app_sha256 }}"
            size       = [int64]"${{ steps.locate.outputs.app_size }}"
            filename   = "${{ steps.locate.outputs.app_filename }}"
            channels   = [ordered]@{
              stable = [ordered]@{ version = "${{ steps.appver.outputs.version }}"; url = $url }
              beta   = [ordered]@{ version = "${{ steps.appver.outputs.version }}"; url = $url }
            }
            updated_at = (Get-Date).ToUniversalTime().ToString("o")
          }
          Set-Content -Path public/desktop-version.json -Value ($manifest | ConvertTo-Json -Depth 6) -Encoding UTF8

      - name: Commit updated pointer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/downloads/windows-installer.asset.json public/desktop-version.json

          if git diff --cached --quiet; then
            echo "No pointer changes to commit."
          else
            git commit -m "ci: update Windows installer pointers [skip ci]"
            git push
          fi
