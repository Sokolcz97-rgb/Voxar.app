name: Build StudioVoxario

on:
  push:
    branches:
      - main # Spustí se při každé změně v hlavní větvi

jobs:
  build:
    runs-on: windows-latest # Vyžaduje Windows pro vytvoření .exe

    steps:
      - name: Stáhnutí kódu
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Sestavení Windows buildu
        run: |
          cd dev-server
          npm install
          npx vite build
          npx @electron/packager electron StudioVoxario --platform=win32 --arch=x64 --out=electron-release --overwrite

      - name: 2. Zabalení vlastního instalátoru
        run: |
          cd installer
          npm install
          node build.cjs

      - name: 3. Nahrání na CDN (Lovable)
        run: |
          # Nahradit cestu podle toho, kam build.cjs ukládá výsledek
          npx lovable-assets create --file installer/StudioVoxarioInstaller.exe --filename StudioVoxarioSetup-0.0.9-alpha.exe > src/assets/downloads/windows-installer.asset.json
        env:
          # Pokud Lovable vyžaduje pro upload API klíč, musíš ho přidat do GitHub Secrets
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
