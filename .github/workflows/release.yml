name: Build StudioVoxario Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for electron/package.json (patch|minor|major|none)'
        required: false
        default: 'patch'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Kanonická verze desktopu je VÝHRADNĚ electron/package.json.
      # Root package.json se pro update verzi nepoužívá.
      - name: Bump canonical desktop version (electron/package.json)
        if: github.event_name == 'push' || inputs.bump != 'none'
        shell: bash
        run: |
          set -euo pipefail
          BUMP="${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm --prefix electron version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./electron/package.json').version")
          git add electron/package.json electron/package-lock.json || true
          git commit -m "ci: desktop v$VERSION [skip ci]" || echo "nothing to commit"
          git push

      - name: Resolve desktop version
        id: appver
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./electron/package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desktop version: $VERSION"

      - name: Install root deps
        run: npm ci || npm install

      - name: Build frontend (Vite) + prepare renderer
        run: npm run desktop:prepare

      - name: Verify packaged renderer
        shell: bash
        run: |
          test -f electron/dist/index.html || { echo "Missing electron/dist/index.html"; exit 1; }
          test -d electron/dist/assets || { echo "Missing electron/dist/assets"; exit 1; }

      - name: Install electron deps
        working-directory: electron
        run: npm install

      # electron-builder: NSIS target + latest.yml (+ blockmap) + publish na GitHub Release v<version>
      - name: Build & publish Windows NSIS via electron-builder
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release:win

      - name: Verify generated update artifacts
        shell: bash
        run: node scripts/verify-release-artifacts.cjs "${{ steps.appver.outputs.version }}"

      - name: Upload artifacts (CI debug)
        uses: actions/upload-artifact@v4
        with:
          name: StudioVoxario-win-${{ steps.appver.outputs.version }}
          path: |
            electron/release/StudioVoxarioSetup-*.exe
            electron/release/latest.yml
            electron/release/*.blockmap
          if-no-files-found: error

      # desktop-version.json je metadata pro download stránku.
      # public/latest.yml + public/beta.yml jsou POUZE migrační bootstrap pro
      # staré instalace, které ještě používají generic feed studiovoxario.com.
      - name: Update website download metadata and legacy bootstrap feed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-desktop-metadata.cjs "${{ steps.appver.outputs.version }}" "${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/desktop-version.json \
            public/latest.yml \
            public/beta.yml \
            src/assets/downloads/windows-installer.asset.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "ci: update desktop metadata and legacy feed v${{ steps.appver.outputs.version }} [skip ci]"
            git push
          fi
