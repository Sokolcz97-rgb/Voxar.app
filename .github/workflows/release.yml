name: Build StudioVoxario Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'installer/**'
      - 'scripts/verify-release-artifacts.cjs'
      - 'scripts/write-desktop-metadata.cjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release version bump (patch|minor|major)'
        required: false
        default: 'patch'

permissions:
  contents: write

# Release nikdy nezapisuje přímo do chráněného main. Verze se odvozuje z
# posledního publikovaného GitHub Release a mění se pouze v pracovním runneru.
concurrency:
  group: studiovoxario-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout protected main snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Resolve release version without modifying main
        id: appver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUMP="${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "Unsupported version bump: $BUMP"; exit 1 ;;
          esac

          PACKAGE_VERSION=$(node -p "require('./electron/package.json').version")
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          RELEASE_VERSION="${LATEST_TAG#v}"
          BASE_VERSION="$PACKAGE_VERSION"

          if [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BASE_VERSION=$(node - "$PACKAGE_VERSION" "$RELEASE_VERSION" <<'NODE'
          const versions = process.argv.slice(2).map((value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) throw new Error(`Invalid semver: ${value}`);
            return { raw: value, parts: match.slice(1).map(Number) };
          });
          versions.sort((a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a.parts[i] !== b.parts[i]) return a.parts[i] - b.parts[i];
            }
            return 0;
          });
          console.log(versions.at(-1).raw);
          NODE
            )
          fi

          VERSION=$(node - "$BASE_VERSION" "$BUMP" <<'NODE'
          const [base, bump] = process.argv.slice(2);
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(base);
          if (!match) throw new Error(`Invalid semver: ${base}`);
          let [major, minor, patch] = match.slice(1).map(Number);
          if (bump === 'major') { major += 1; minor = 0; patch = 0; }
          if (bump === 'minor') { minor += 1; patch = 0; }
          if (bump === 'patch') { patch += 1; }
          console.log(`${major}.${minor}.${patch}`);
          NODE
          )

          # Verzi nastavíme jen lokálně v runneru. Žádný commit ani push do main.
          npm --prefix electron version "$VERSION" --no-git-tag-version --allow-same-version

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_release=${RELEASE_VERSION:-none}" >> "$GITHUB_OUTPUT"
          echo "Desktop release: $VERSION (source package: $PACKAGE_VERSION, latest release: ${RELEASE_VERSION:-none})"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend and prepare renderer
        run: npm run desktop:prepare

      - name: Verify packaged renderer and Protect v2.4
        shell: bash
        run: |
          set -euo pipefail
          test -f electron/dist/index.html
          test -d electron/dist/assets
          test -f electron/app-update.yml
          test -f electron/assets/installer.nsh
          test -f electron/protect-layered-engine.cjs
          test -f electron/protect-firewall.cjs
          node --check electron/protect-layered-engine.cjs
          node --check electron/protect-firewall.cjs
          npm --prefix electron run test:protect
          grep -q "VOXARIO_NATIVE_TAB_DRAG_V1" electron/browser.html
          grep -q "VOXARIO_MODULE_STATE_DURABLE_V1" electron/main.cjs
          echo "Protect v2.4 and desktop renderer are ready for packaging."

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build and publish Voxar.app update payload
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release:win

      - name: Verify Voxar.app updater payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-artifacts.cjs "${{ steps.appver.outputs.version }}"
          test -f electron/release/win-unpacked/resources/app-update.yml

      - name: Build and publish VoxarioBrowser update payload
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release:browser:win

      - name: Verify VoxarioBrowser updater payload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-artifacts.cjs "${{ steps.appver.outputs.version }}" browser
          test -f electron/release/browser/win-unpacked/resources/app-update.yml
          grep -q 'channel: browser' electron/release/browser/win-unpacked/resources/app-update.yml

      - name: Prepare custom installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item electron/assets/icon.ico installer/assets/icon.ico -Force
          $version = "${{ steps.appver.outputs.version }}"
          $pkgPath = "installer/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding UTF8
          Write-Host "Custom installer version: $version"

      - name: Install custom installer dependencies
        working-directory: installer
        run: npm install --no-audit --no-fund

      - name: Build custom StudioVoxario HUD installer runtime
        working-directory: installer
        run: node build.cjs

      - name: Build custom VoxarioBrowser installer runtime
        working-directory: installer
        run: node build.cjs --product=browser

      - name: Download 7-Zip SFX module
        id: sfx
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip not installed at $sevenZip" }
          $archive = Join-Path $env:RUNNER_TEMP "lzma-sdk.7z"
          $directory = Join-Path $env:RUNNER_TEMP "lzma-sdk"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.7-zip.org/a/lzma2602.7z" -OutFile $archive
          if (Test-Path $directory) { Remove-Item -Recurse -Force $directory }
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          & $sevenZip x $archive "-o$directory" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed with code $LASTEXITCODE" }
          $sfx = Get-ChildItem -Recurse $directory -Filter "7zSD.sfx" -File | Select-Object -First 1
          if ($null -eq $sfx) { throw "7zSD.sfx not found" }
          "path=$($sfx.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build single-file VoxarioBrowser Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.appver.outputs.version }}"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $sfx = "${{ steps.sfx.outputs.path }}"
          $payloadDir = Resolve-Path "installer/dist/VoxarioBrowserInstaller-win32-x64"
          $installerExe = Join-Path $payloadDir "VoxarioBrowserInstaller.exe"
          if (!(Test-Path $installerExe)) { throw "Custom Browser installer runtime missing: $installerExe" }
          $archive = Join-Path $env:RUNNER_TEMP "voxariobrowser-custom-installer.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $payloadDir
          try {
            & $sevenZip a -t7z -mx=5 -ms=on -r $archive ".\*"
            if ($LASTEXITCODE -ne 0) { throw "7z pack failed" }
          } finally { Pop-Location }
          $cfg = Join-Path $env:RUNNER_TEMP "voxariobrowser-sfx-config.txt"
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($cfg, (';!@Install@!UTF-8!','Title="VoxarioBrowser"','RunProgram="VoxarioBrowserInstaller.exe"','GUIMode="2"',';!@InstallEnd@!' -join "`r`n") + "`r`n", $utf8Bom)
          $outFile = "electron/release/browser/VoxarioBrowserSetup-$version.exe"
          $out = [System.IO.File]::Open($outFile, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($part in @($sfx, $cfg, $archive)) {
              $stream = [System.IO.File]::OpenRead($part)
              try { $stream.CopyTo($out) } finally { $stream.Dispose() }
            }
          } finally { $out.Dispose() }
          if (!(Test-Path $outFile)) { throw "Browser Setup EXE was not created" }

      - name: Build single-file StudioVoxario Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.appver.outputs.version }}"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $sfx = "${{ steps.sfx.outputs.path }}"
          $payloadDir = Resolve-Path "installer/dist/StudioVoxarioInstaller-win32-x64"
          $installerExe = Join-Path $payloadDir "StudioVoxarioInstaller.exe"
          if (!(Test-Path $installerExe)) { throw "Custom HUD installer runtime missing: $installerExe" }
          $archive = Join-Path $env:RUNNER_TEMP "studiovoxario-custom-installer.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $payloadDir
          try {
            & $sevenZip a -t7z -mx=5 -ms=on -r $archive ".\*"
            if ($LASTEXITCODE -ne 0) { throw "7z pack failed" }
          } finally { Pop-Location }
          $cfg = Join-Path $env:RUNNER_TEMP "studiovoxario-sfx-config.txt"
          $configLines = @(
            ';!@Install@!UTF-8!',
            'Title="StudioVoxario"',
            'RunProgram="StudioVoxarioInstaller.exe"',
            'GUIMode="2"',
            ';!@InstallEnd@!'
          )
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($cfg, ($configLines -join "`r`n") + "`r`n", $utf8Bom)
          $outFile = "electron/release/StudioVoxarioSetup-$version.exe"
          if (Test-Path $outFile) { Remove-Item $outFile -Force }
          $out = [System.IO.File]::Open($outFile, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($part in @($sfx, $cfg, $archive)) {
              $stream = [System.IO.File]::OpenRead($part)
              try { $stream.CopyTo($out) } finally { $stream.Dispose() }
            }
          } finally { $out.Dispose() }
          if (!(Test-Path $outFile)) { throw "StudioVoxario Setup EXE was not created" }
          Write-Host "SHA256: $((Get-FileHash $outFile -Algorithm SHA256).Hash.ToLower())"

      - name: Upload stable Setup aliases to version release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.appver.outputs.version }}"
          APP_FILE="electron/release/StudioVoxarioSetup-$VERSION.exe"
          APP_STABLE="electron/release/StudioVoxarioSetup.exe"
          BROWSER_FILE="electron/release/browser/VoxarioBrowserSetup-$VERSION.exe"
          BROWSER_STABLE="electron/release/browser/VoxarioBrowserSetup.exe"
          test -f "$APP_FILE"
          test -f "$BROWSER_FILE"
          cp "$APP_FILE" "$APP_STABLE"
          cp "$BROWSER_FILE" "$BROWSER_STABLE"
          gh release upload "v$VERSION" "$APP_FILE" "$APP_STABLE" "$BROWSER_FILE" "$BROWSER_STABLE" --clobber --repo "${{ github.repository }}"

      - name: Verify custom and updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.appver.outputs.version }}"
          test -f "electron/release/StudioVoxarioSetup-$VERSION.exe"
          test -f "electron/release/StudioVoxarioSetup.exe"
          test -f "electron/release/StudioVoxarioUpdate-$VERSION.exe"
          test -f "electron/release/browser/VoxarioBrowserUpdate-$VERSION.exe"
          test -f "electron/release/browser/VoxarioBrowserSetup-$VERSION.exe"
          test -f "electron/release/browser/browser.yml"
          test -f electron/release/latest.yml

      - name: Upload release artifacts for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: StudioVoxario-win-${{ steps.appver.outputs.version }}
          path: |
            electron/release/StudioVoxarioSetup-*.exe
            electron/release/StudioVoxarioSetup.exe
            electron/release/StudioVoxarioUpdate-*.exe
            electron/release/latest.yml
            electron/release/*.blockmap
            electron/release/win-unpacked/resources/app-update.yml
            electron/release/browser/VoxarioBrowserSetup-*.exe
            electron/release/browser/VoxarioBrowserSetup.exe
            electron/release/browser/VoxarioBrowserUpdate-*.exe
            electron/release/browser/browser.yml
          if-no-files-found: error

      - name: Publish complete release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.appver.outputs.version }}"
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --repo "$REPO"
          LATEST_TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          if [ "$LATEST_TAG" != "$TAG" ]; then
            echo "Latest release mismatch: expected $TAG, got $LATEST_TAG"
            exit 1
          fi
          for FILE in StudioVoxarioSetup.exe VoxarioBrowserSetup.exe; do
            URL="https://github.com/$REPO/releases/latest/download/$FILE"
            STATUS=$(curl --head --location --silent --show-error --output /dev/null --write-out '%{http_code}' "$URL")
            if [ "$STATUS" != "200" ]; then
              echo "Stable installer URL for $FILE returned HTTP $STATUS"
              exit 1
            fi
          done
          echo "$TAG is public and both stable installers are downloadable."

      - name: Generate website and legacy metadata without pushing main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.appver.outputs.version }}"
          node scripts/write-desktop-metadata.cjs "$VERSION" "${{ github.repository }}"
          echo "Metadata generated locally. Protected main remains untouched."

      - name: Upload generated metadata for follow-up PR
        uses: actions/upload-artifact@v4
        with:
          name: StudioVoxario-metadata-${{ steps.appver.outputs.version }}
          path: |
            public/desktop-version.json
            public/latest.yml
            public/beta.yml
            src/assets/downloads/windows-installer.asset.json
          if-no-files-found: error
