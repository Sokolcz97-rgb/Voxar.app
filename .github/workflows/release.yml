name: Build StudioVoxario

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm install

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Package Electron app (win32-x64)
        run: npx --yes @electron/packager electron StudioVoxario --platform=win32 --arch=x64 --out=electron-release --overwrite --icon=electron/assets/icon.ico

      - name: Prepare installer icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/assets | Out-Null
          Copy-Item electron/assets/icon.ico installer/assets/icon.ico -Force

      - name: Install installer deps
        working-directory: installer
        run: npm install

      - name: Build HUD installer .exe
        working-directory: installer
        run: node build.cjs

      - name: Build self-extracting installer (.exe)
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payloadDir = Resolve-Path "installer/dist/StudioVoxarioInstaller-win32-x64"
          $exe = Join-Path $payloadDir "StudioVoxarioInstaller.exe"
          Write-Host "== Payload check =="
          if (!(Test-Path $exe)) { throw "Installer payload not found at $exe" }
          Write-Host "Payload dir: $payloadDir"
          Get-ChildItem $payloadDir | Select-Object -First 20 Name, Length | Format-Table | Out-String | Write-Host

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip not installed at $sevenZip" }

          Write-Host "== Download 7-Zip Extra (SFX modules) =="
          $extraArchive = Join-Path $env:RUNNER_TEMP "7zextra.7z"
          $extraDir     = Join-Path $env:RUNNER_TEMP "7zextra"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.7-zip.org/a/7z2301-extra.7z" -OutFile $extraArchive
          Write-Host ("Downloaded: {0} bytes" -f (Get-Item $extraArchive).Length)
          if (Test-Path $extraDir) { Remove-Item -Recurse -Force $extraDir }
          New-Item -ItemType Directory -Force -Path $extraDir | Out-Null
          & $sevenZip x $extraArchive "-o$extraDir" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extract of $extraArchive failed with code $LASTEXITCODE" }
          $sfx = Join-Path $extraDir "7zSD.sfx"
          if (!(Test-Path $sfx)) {
            Write-Host "7zSD.sfx missing. Extra dir contents:"
            Get-ChildItem -Recurse $extraDir | Select-Object FullName | Format-Table | Out-String | Write-Host
            throw "7zSD.sfx not found after extract"
          }
          Write-Host ("SFX module: {0} ({1} bytes)" -f $sfx, (Get-Item $sfx).Length)

          Write-Host "== Pack payload into 7z =="
          $archive = Join-Path $env:RUNNER_TEMP "payload.7z"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $payloadDir
          try {
            & $sevenZip a -t7z -mx=5 -ms=on -r $archive ".\*"
            if ($LASTEXITCODE -ne 0) { throw "7z pack failed with code $LASTEXITCODE" }
          } finally { Pop-Location }
          Write-Host ("Archive: {0} ({1:N1} MB)" -f $archive, ((Get-Item $archive).Length / 1MB))

          Write-Host "== Write SFX config =="
          $cfg = Join-Path $env:RUNNER_TEMP "config.txt"
          $configLines = @(
            ';!@Install@!UTF-8!',
            'Title="StudioVoxario"',
            'BeginPrompt="Instalovat StudioVoxario?"',
            'RunProgram="StudioVoxarioInstaller.exe"',
            'GUIMode="2"',
            ';!@InstallEnd@!'
          )
          # SFX config MUST be UTF-8 with BOM; use .NET writer for byte-exact control.
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($cfg, ($configLines -join "`r`n") + "`r`n", $utf8Bom)
          Write-Host ("Config: {0} bytes" -f (Get-Item $cfg).Length)

          Write-Host "== Concatenate SFX + config + payload =="
          $outDir = "installer/dist/final"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $renamed = Join-Path $outDir "StudioVoxarioSetup-0.0.9-alpha.exe"
          if (Test-Path $renamed) { Remove-Item $renamed -Force }
          $out = [System.IO.File]::Open($renamed, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($part in @($sfx, $cfg, $archive)) {
              $inStream = [System.IO.File]::OpenRead($part)
              try { $inStream.CopyTo($out) } finally { $inStream.Dispose() }
            }
          } finally { $out.Dispose() }
          if (!(Test-Path $renamed)) { throw "SFX build failed — output missing" }

          $size = (Get-Item $renamed).Length
          $hash = (Get-FileHash $renamed -Algorithm SHA256).Hash.ToLower()
          Write-Host ("== DONE == {0} ({1:N1} MB) sha256={2}" -f $renamed, ($size / 1MB), $hash)
          "path=$renamed"       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size=$size"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "filename=StudioVoxarioSetup-0.0.9-alpha.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create / update GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: StudioVoxario Desktop (latest)
          body: |
            Automatický build z commitu ${{ github.sha }}.
            Verze: 0.0.9-alpha
          files: ${{ steps.locate.outputs.path }}
          prerelease: true
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write installer pointer JSON
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets/downloads | Out-Null
          $url = "https://github.com/${{ github.repository }}/releases/download/desktop-latest/${{ steps.locate.outputs.filename }}"
          $obj = [ordered]@{
            version           = 1
            url               = $url
            original_filename = "${{ steps.locate.outputs.filename }}"
            size              = [int64]"${{ steps.locate.outputs.size }}"
            sha256            = "${{ steps.locate.outputs.sha256 }}"
            content_type      = "application/x-msdownload"
            source            = "github-release"
            tag               = "desktop-latest"
            commit            = "${{ github.sha }}"
            updated_at        = (Get-Date).ToUniversalTime().ToString("o")
          }
          $json = $obj | ConvertTo-Json -Depth 5
          Set-Content -Path src/assets/downloads/windows-installer.asset.json -Value $json -Encoding UTF8
          Get-Content src/assets/downloads/windows-installer.asset.json

      - name: Commit updated pointer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/downloads/windows-installer.asset.json
          if git diff --cached --quiet; then
            echo "No pointer changes to commit."
          else
            git commit -m "ci: update Windows installer pointer [skip ci]"
            git push
          fi
