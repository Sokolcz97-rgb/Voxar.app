name: Unity Windows build

on:
  push:
    branches:
      - 'unity/**'
    paths:
      - 'game/unity/**'
      - '.github/workflows/unity-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Unity Windows (HDRP, DirectX 12, DLSS)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/cache@v4
        with:
          path: game/unity/AshesOfEryon/Library
          key: unity-library-${{ hashFiles('game/unity/AshesOfEryon/Packages/manifest.json', 'game/unity/AshesOfEryon/Assets/Models/**') }}
          restore-keys: unity-library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game/unity/AshesOfEryon
          unityVersion: 6000.0.85f1
          targetPlatform: StandaloneWindows64
          buildMethod: VoxarioBuild.BuildWindows
          buildName: AshesOfEryon
          buildsPath: build
          versioning: None
          allowDirtyBuild: true
      - name: Build contents
        if: always()
        run: |
          sudo chown -R "$(id -u)" build game/unity/AshesOfEryon 2>/dev/null || true
          find build -maxdepth 3 | head -50
          find build -iname "*nvngx*" || true
          du -sh build || true
      - uses: actions/upload-artifact@v4
        with:
          name: AshesOfEryon-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

  selftest:
    name: Unity self-test (Windows, screenshots)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AshesOfEryon-Windows
          path: game
      - name: Run self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "game\AshesOfEryon.exe" -ArgumentList "-voxario-selftest","-force-d3d11","-screen-fullscreen","0","-screen-width","1280","-screen-height","720","-logFile","$pwd\player.log" -PassThru
          if (-not $p.WaitForExit(240000)) { Write-Host "TIMEOUT"; Stop-Process -Id $p.Id -Force }
          Write-Host "exit: $($p.ExitCode)"
          Select-String -Path player.log -Pattern "\[Voxario\]|Exception|error|Error|Shader|shader" | Select-Object -First 150 | ForEach-Object { $_.Line }
          Get-ChildItem game\selftest -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AshesOfEryon-selftest
          path: |
            player.log
            game/selftest/
          retention-days: 7
